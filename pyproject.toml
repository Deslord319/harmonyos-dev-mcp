[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harmonyos-dev-mcp"
version = "0.10.0"
description = "HarmonyOS MCP service for device automation, app deployment, UI interaction, E2E support, and log validation."
requires-python = ">=3.12"
readme = "README.md"
authors = [
    { name = "huduanmu", email = "772927148@qq.com" }
]
dependencies = [
    "fastmcp>=0.1.0",
    "loguru>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/Deslord319/harmonyos-dev-mcp"
Repository = "https://github.com/Deslord319/harmonyos-dev-mcp"
Documentation = "https://github.com/Deslord319/harmonyos-dev-mcp/tree/main/docs"
Issues = "https://github.com/Deslord319/harmonyos-dev-mcp/issues"

[project.scripts]
harmonyos-dev-mcp = "harmonyos_dev_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harmonyos_dev_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/docs",
    "/src",
    "/tests",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [".*", "dist", "htmlcov", ".venv"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/harmonyos_dev_mcp"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
